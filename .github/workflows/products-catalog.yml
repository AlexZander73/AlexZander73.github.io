name: Build Products Catalog

on:
  push:
    branches: [main]
    paths:
      - "data/showcase.json"
      - "products/**"
      - "projects/**"
      - "support/**"
      - "privacy/**"
      - "carpentry-companion/**"
      - "*.html"
      - "CNAME"
      - "scripts/build-catalog.py"
      - ".github/workflows/products-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate catalog and sitemap from the shared registry
        run: python3 scripts/build-catalog.py
      - name: Validate generated files
        run: python3 scripts/build-catalog.py --check
      - name: Commit generated files if changed
        run: |
          if git diff --quiet -- products/catalog.json sitemap.xml; then
            echo "No catalog changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add products/catalog.json sitemap.xml
            git commit -m "Update generated product catalog and sitemap"
            git push
          fi
